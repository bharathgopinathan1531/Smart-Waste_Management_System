services:
  db:
    image: postgres:16-alpine
    container_name: smart_waste_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_waste
      POSTGRES_USER: smart_waste_user
      POSTGRES_PASSWORD: change_this_local_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_waste_user -d smart_waste"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: smart_waste_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://smart_waste_user:change_this_local_password@db:5432/smart_waste

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: